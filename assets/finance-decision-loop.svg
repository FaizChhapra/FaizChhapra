<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Finance to decision animated loop</title>
  <desc id="description">An animated flow showing finance inputs becoming data, analysis, and a decision.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111c2d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d483"/>
      <stop offset="1" stop-color="#b69b5e"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b69b5e"/>
      <stop offset="0.52" stop-color="#57b6c8"/>
      <stop offset="1" stop-color="#65c18c"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="flow-path" d="M218 133 C330 65 420 202 532 133 S742 65 850 133 S1000 190 1062 133"/>
  </defs>

  <rect x="2" y="2" width="1196" height="296" rx="28" fill="url(#background)" stroke="#25334a" stroke-width="4"/>
  <path d="M72 68 H1128" stroke="#243249" stroke-width="1"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="43" fill="#f4f0e8" font-size="17" font-weight="700" letter-spacing="3">THE FINANCE DECISION LOOP</text>
    <text x="1128" y="43" fill="#8290a6" font-size="13" text-anchor="end" letter-spacing="2">QUESTION → EVIDENCE → JUDGMENT</text>

    <path d="M218 133 C330 65 420 202 532 133 S742 65 850 133 S1000 190 1062 133" fill="none" stroke="#27364c" stroke-width="8" stroke-linecap="round"/>
    <path d="M218 133 C330 65 420 202 532 133 S742 65 850 133 S1000 190 1062 133" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 16">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="2.4s" repeatCount="indefinite"/>
    </path>

    <!-- Finance core -->
    <g transform="translate(154 133)">
      <circle r="58" fill="#101b2c" stroke="#b69b5e" stroke-width="3"/>
      <circle r="44" fill="url(#gold)" opacity="0.14">
        <animate attributeName="r" values="40;49;40" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.10;0.24;0.10" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="10" fill="#f4d483" font-size="40" font-weight="700" text-anchor="middle">$</text>
    </g>
    <text x="154" y="214" fill="#f4f0e8" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">FINANCE</text>
    <text x="154" y="236" fill="#8290a6" font-size="12" text-anchor="middle">Start with the economics</text>

    <!-- Evidence node -->
    <g transform="translate(410 133)">
      <circle r="47" fill="#101b2c" stroke="#57b6c8" stroke-width="2"/>
      <g fill="#57b6c8">
        <rect x="-24" y="9" width="10" height="17" rx="2">
          <animate attributeName="height" values="8;17;8" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/>
          <animate attributeName="y" values="18;9;18" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="-5" y="-2" width="10" height="28" rx="2">
          <animate attributeName="height" values="12;28;12" dur="2.4s" begin="-0.9s" repeatCount="indefinite"/>
          <animate attributeName="y" values="14;-2;14" dur="2.4s" begin="-0.9s" repeatCount="indefinite"/>
        </rect>
        <rect x="14" y="-17" width="10" height="43" rx="2">
          <animate attributeName="height" values="15;43;15" dur="2.4s" begin="-1.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="11;-17;11" dur="2.4s" begin="-1.3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <text x="410" y="214" fill="#f4f0e8" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">EVIDENCE</text>
    <text x="410" y="236" fill="#8290a6" font-size="12" text-anchor="middle">Make the drivers visible</text>

    <!-- Analysis engine -->
    <g transform="translate(666 133)">
      <circle r="55" fill="#101b2c" stroke="#4c6685" stroke-width="2"/>
      <circle r="43" fill="none" stroke="#57b6c8" stroke-width="2" stroke-dasharray="10 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="31" fill="none" stroke="#b69b5e" stroke-width="2" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="9" fill="#f4f0e8" font-size="28" font-weight="700" text-anchor="middle">Σ</text>
    </g>
    <text x="666" y="214" fill="#f4f0e8" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">ANALYSIS</text>
    <text x="666" y="236" fill="#8290a6" font-size="12" text-anchor="middle">Model, test, challenge</text>

    <!-- Decision output -->
    <g transform="translate(924 133)">
      <circle r="55" fill="#101b2c" stroke="#65c18c" stroke-width="2"/>
      <path d="M-23 2 L-7 18 L25 -19" fill="none" stroke="#65c18c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.16"/>
      <path d="M-23 2 L-7 18 L25 -19" fill="none" stroke="#65c18c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="84" stroke-dashoffset="84">
        <animate attributeName="stroke-dashoffset" values="84;84;0;0;84" keyTimes="0;0.2;0.4;0.88;1" dur="4.8s" repeatCount="indefinite"/>
      </path>
      <circle r="48" fill="none" stroke="#65c18c" stroke-width="2" opacity="0">
        <animate attributeName="r" values="42;42;62" keyTimes="0;0.72;1" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.55;0" keyTimes="0;0.72;0.82;1" dur="4.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="924" y="214" fill="#f4f0e8" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">DECISION</text>
    <text x="924" y="236" fill="#8290a6" font-size="12" text-anchor="middle">Explain what matters</text>

    <!-- Animated decision signal -->
    <circle r="8" fill="#f4d483" filter="url(#soft-glow)" opacity="0">
      <animateMotion dur="4.8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flow-path" xlink:href="#flow-path"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.94;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#f4d483;#57b6c8;#57b6c8;#65c18c" keyTimes="0;0.34;0.68;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="7;11;7;11;7" dur="4.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Trail particles -->
    <g fill="#57b6c8" opacity="0.78">
      <circle r="4" opacity="0">
        <animateMotion dur="4.8s" begin="-0.55s" repeatCount="indefinite"><mpath href="#flow-path" xlink:href="#flow-path"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.94;1" dur="4.8s" begin="-0.55s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" opacity="0">
        <animateMotion dur="4.8s" begin="-1.05s" repeatCount="indefinite"><mpath href="#flow-path" xlink:href="#flow-path"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.94;1" dur="4.8s" begin="-1.05s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="600" y="278" fill="#9aa8bc" font-size="12" text-anchor="middle" letter-spacing="1.2">FINANCE IS THE CORE  •  TECHNOLOGY IS THE TOOL  •  EVIDENCE EARNS TRUST</text>
  </g>
</svg>
