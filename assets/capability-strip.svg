<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title description">
  <title id="title">Finance capability map</title>
  <desc id="description">Three visual cards showing planning and performance, valuation, and research and automation.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1423"/>
      <stop offset="1" stop-color="#121f31"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="232" rx="24" fill="url(#background)" stroke="#26364e" stroke-width="4"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(42 28)">
      <rect width="344" height="180" rx="18" fill="#0d1929" stroke="#3b4657"/>
      <circle cx="54" cy="54" r="30" fill="#b69b5e" opacity="0.13"/>
      <circle cx="54" cy="54" r="22" fill="none" stroke="#d6b96e" stroke-width="2"/>
      <path d="M41 63 V53 M51 63 V43 M61 63 V35 M39 67 H68" fill="none" stroke="#d6b96e" stroke-width="4" stroke-linecap="round"/>
      <path d="M92 49 H302" stroke="#b69b5e" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <text x="92" y="43" fill="#f4f0e8" font-size="15" font-weight="700" letter-spacing="1.6">PLAN &amp; PERFORM</text>
      <text x="28" y="115" fill="#f4f0e8" font-size="23" font-weight="700">See what changed</text>
      <text x="28" y="145" fill="#8e9bb0" font-size="14">Budgets · forecasts · variance · cash flow</text>
    </g>

    <g transform="translate(428 28)">
      <rect width="344" height="180" rx="18" fill="#0d1929" stroke="#3b4657"/>
      <circle cx="54" cy="54" r="30" fill="#57b6c8" opacity="0.12"/>
      <path d="M34 58 C44 36 61 36 74 47" fill="none" stroke="#57b6c8" stroke-width="3" stroke-linecap="round"/>
      <path d="M35 68 C48 48 65 56 74 38" fill="none" stroke="#57b6c8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="35" cy="68" r="4" fill="#57b6c8"/>
      <circle cx="74" cy="38" r="4" fill="#57b6c8"/>
      <path d="M92 49 H302" stroke="#57b6c8" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <text x="92" y="43" fill="#f4f0e8" font-size="15" font-weight="700" letter-spacing="1.6">VALUE</text>
      <text x="28" y="115" fill="#f4f0e8" font-size="23" font-weight="700">Understand the drivers</text>
      <text x="28" y="145" fill="#8e9bb0" font-size="14">Cash flows · scenarios · sensitivities · risk</text>
    </g>

    <g transform="translate(814 28)">
      <rect width="344" height="180" rx="18" fill="#0d1929" stroke="#3b4657"/>
      <circle cx="54" cy="54" r="30" fill="#65c18c" opacity="0.12"/>
      <rect x="36" y="34" width="29" height="39" rx="4" fill="none" stroke="#65c18c" stroke-width="3"/>
      <path d="M42 44 H59 M42 52 H57 M42 60 H52" stroke="#65c18c" stroke-width="3" stroke-linecap="round"/>
      <circle cx="68" cy="65" r="10" fill="#0d1929" stroke="#65c18c" stroke-width="3"/>
      <path d="M75 72 L83 80" stroke="#65c18c" stroke-width="4" stroke-linecap="round"/>
      <path d="M92 49 H302" stroke="#65c18c" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <text x="92" y="43" fill="#f4f0e8" font-size="15" font-weight="700" letter-spacing="1.6">RESEARCH</text>
      <text x="28" y="115" fill="#f4f0e8" font-size="23" font-weight="700">Explain what matters</text>
      <text x="28" y="145" fill="#8e9bb0" font-size="14">Filings · data · evidence · communication</text>
    </g>

    <circle cx="403" cy="118" r="4" fill="#b69b5e" filter="url(#glow)"/>
    <circle cx="797" cy="118" r="4" fill="#57b6c8" filter="url(#glow)"/>
  </g>
</svg>
